<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Send forespørgsel</title>
<link rel="manifest" href="manifest.json?v=2">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#0f3b2e">

<style>
body{
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
background:#f4f6f5;
margin:0;
padding:20px;
}

.card{
max-width:420px;
margin:auto;
background:white;
padding:25px;
border-radius:18px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
text-align:center;
}

.logo{
width:180px;
display:block;
margin:0 auto 20px auto;
}

h1{
font-size:20px;
color:#0f3b2e;
margin-bottom:20px;
}

label{
font-weight:600;
display:block;
margin-top:15px;
text-align:center;
}

textarea,
input{
width:90%;
padding:14px;
margin:5px auto 0 auto;
display:block;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
box-sizing:border-box;
}

textarea{
min-height:130px;
resize:vertical;
}

.sendBtn{
display:block;
width:90%;
padding:18px;
margin:20px auto 0 auto;
border-radius:12px;
border:none;
font-size:18px;
font-weight:600;
background:#0f3b2e;
color:white;
text-decoration:none;
box-sizing:border-box;
cursor:pointer;
}

.backLink{
display:inline-block;
margin-top:20px;
color:#0f3b2e;
text-decoration:none;
font-weight:600;
}

.error{
margin-top:12px;
font-size:14px;
color:#b00020;
min-height:20px;
}

.version{
margin-top:25px;
text-align:center;
font-size:12px;
color:#888;
}
</style>
</head>

<body>

<div class="card">
<img src="logo.png" class="logo">

<h1>Send forespørgsel</h1>

<label for="message">Hvad mangler du?</label>
<textarea id="message" placeholder="Skriv hvad du mangler"></textarea>

<label for="name">Dit navn</label>
<input type="text" id="name" placeholder="Skriv dit navn" required>

<div class="error" id="errorMsg"></div>

<button class="sendBtn" onclick="sendRequest()">Send</button>

<a class="backLink" href="index.html">← Tilbage</a>

<div class="version">Version 1.2</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
(function(){
emailjs.init("gdKd_m0NTE-hAOQUk");
})();

function sendRequest(){
const message = document.getElementById("message").value.trim();
const name = document.getElementById("name").value.trim();
const errorMsg = document.getElementById("errorMsg");

if (!message || !name) {
errorMsg.textContent = "Du skal udfylde både besked og navn.";
return;
}

errorMsg.textContent = "";

emailjs.send("service_yggfz12", "template_vyngmgd", {
name: name,
message: message
})
.then(function() {
alert("Din besked er sendt 👍");
document.getElementById("message").value = "";
document.getElementById("name").value = "";
}, function(error) {
errorMsg.textContent = "Fejl ved afsendelse. Prøv igen.";
});
}
</script>

</body>
</html>
